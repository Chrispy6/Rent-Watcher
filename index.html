<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rent Watcher</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Rent Watcher</h1>
    <p> This project aims to help users find rental listings is Golden Colorado </p>
  </header>

  <main>
    <section class="Filters">
      <label for="max_rent"> Maximum Monthly Rent </label>

      <input
      type = "number"
      id = "max_rent"
      placeholder = "2000"
      >

      <label for="min_rent"> Minimum Monthly Rent </label>

      <input
      type = "number"
      id = "min_rent"
      placeholder = "800"
      >

    <button id="filter_button">Apply Filter</button>
    <button id="reset_button">Reset</button>
    </section>

    <p id="results_count"></p>

    <p id="data_status" aria-live="polite"></p>

    <section id="listing_container">


    </section>
  </main>
  <script src="script.js"></script>
</body>
