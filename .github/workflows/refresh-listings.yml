name: Refresh listings and publish website

on:
  push:
    branches: [main]

  schedule:
    - cron: "17 8 * * *"

  workflow_dispatch:
    inputs:
      refresh:
        description: "Fetch new listings from RentCast (uses one request)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      REFRESH_LISTINGS: ${{ github.event_name == 'schedule' || inputs.refresh == true }}

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        if: env.REFRESH_LISTINGS == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: env.REFRESH_LISTINGS == 'true'
        run: python -m pip install -r backend/requirements.txt

      - name: Fetch listings and update Neon
        if: env.REFRESH_LISTINGS == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: |
          python backend/update_listings.py
          python backend/sync_pending.py
          cp Golden_Listings.pending.json Golden_Listings.json

      - name: Save updated snapshot to repository
        if: env.REFRESH_LISTINGS == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Golden_Listings.json

          if ! git diff --cached --quiet; then
            git commit -m "Refresh Golden rental snapshot"
            git push origin HEAD:main
          fi

      - name: Prepare public website files
        run: |
          mkdir -p public
          cp index.html style.css script.js Golden_Listings.json public/

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4